name: opencode

on:
  # Existing /oc and /opencode trigger path — retained unchanged.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

  # New explicit dispatch path for the ChatGPT → GitHub → OpenCode loop.
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Unique G2 task identifier'
        required: true
        type: string
      prompt:
        description: 'Exact task for OpenCode / DeepSeek'
        required: true
        type: string
      model:
        description: 'DeepSeek model'
        required: true
        default: 'deepseek/deepseek-v4-flash'
        type: string

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify Git remote and credentials
        run: |
          git remote -v
          git status --short
          git config --get remote.origin.url

      - name: Set development task identity
        env:
          TASK_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.task_id || format('COMMENT-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          echo "G2_TASK_ID=$TASK_ID" >> "$GITHUB_ENV"
          echo "G2_TASK_ID=$TASK_ID"

      - name: Run OpenCode with official DeepSeek API
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          G2_TASK_ID: ${{ env.G2_TASK_ID }}
        with:
          model: ${{ github.event_name == 'workflow_dispatch' && inputs.model || (contains(github.event.comment.body, '[pro]') && 'deepseek/deepseek-v4-pro' || contains(github.event.comment.body, '/oc-pro') && 'deepseek/deepseek-v4-pro' || contains(github.event.comment.body, '/opencode-pro') && 'deepseek/deepseek-v4-pro' || 'deepseek/deepseek-v4-flash') }}
          prompt: ${{ github.event_name == 'workflow_dispatch' && format('[G2_TASK_ID={0}] {1}', inputs.task_id, inputs.prompt) || '' }}
          use_github_token: true

      - name: Publish task identity
        env:
          TASK_ID: ${{ env.G2_TASK_ID }}
        run: |
          set -euo pipefail
          {
            echo '### G2 development task'
            echo
            echo "- Task ID: \`$TASK_ID\`"
            echo "- Actions Run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Workflow: \`${GITHUB_WORKFLOW}\`"
            echo "- SHA: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # OpenCode is expected to create the PR itself. This is only a safety
      # net for a completed OpenCode run that left an issue branch orphaned.
      - name: Create PR fallback when OpenCode left an orphaned branch
        if: ${{ github.event_name == 'issue_comment' && !github.event.issue.pull_request }}
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const base = context.payload.repository.default_branch;
            const prefix = `opencode/issue${issueNumber}-`;

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            const candidates = branches.map(b => b.name).filter(name => name.startsWith(prefix));

            if (candidates.length === 0) {
              core.info(`No OpenCode branch found for issue #${issueNumber}; nothing to recover.`);
              return;
            }

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base, per_page: 100,
            });
            const existing = openPrs.find(pr => candidates.includes(pr.head.ref));
            if (existing) {
              core.info(`Open PR #${existing.number} already exists for ${existing.head.ref}.`);
              return;
            }

            // Do not blindly create a PR from an untouched branch. Compare each
            // candidate with the base and only recover a branch with real changes.
            for (const head of candidates) {
              const comparison = await github.rest.repos.compareCommits({
                owner, repo, base, head,
              });
              if (comparison.data.ahead_by <= 0 || comparison.data.files?.length === 0) {
                continue;
              }

              const title = `OpenCode issue #${issueNumber}: ${head.replace(prefix, '').slice(0, 80)}`;
              const body = [
                '## OpenCode PR recovery',
                '',
                'OpenCode completed work on this issue branch but did not create the expected PR.',
                'This PR was created automatically as a safety fallback so the development loop does not stall.',
                '',
                `- Issue: #${issueNumber}`,
                `- Head: \`${head}\``,
                `- Base: \`${base}\``,
                `- Commits ahead: ${comparison.data.ahead_by}`,
                '',
                'The normal OpenCode PR path remains the primary path; this is recovery only.',
              ].join('\n');

              const pr = await github.rest.pulls.create({
                owner, repo, head, base, title, body,
              });
              core.notice(`Recovered orphaned OpenCode branch ${head} as PR #${pr.data.number}.`);
              return;
            }

            core.info(`No changed OpenCode branch found for issue #${issueNumber}; no fallback PR created.`);