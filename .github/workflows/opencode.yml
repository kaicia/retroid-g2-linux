name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Unique G2 task identifier'
        required: true
        type: string
      request_id:
        description: 'Unique execution request identifier'
        required: true
        type: string
      prompt:
        description: 'Exact task for OpenCode / DeepSeek'
        required: true
        type: string
      model:
        description: 'DeepSeek model'
        required: true
        default: 'deepseek/deepseek-v4-flash'
        type: string

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify Git remote and credentials
        run: |
          set -euo pipefail
          git remote -v
          git status --short
          git config --get remote.origin.url

      - name: Set development task identity
        env:
          TASK_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.task_id || format('COMMENT-{0}', github.run_id) }}
          REQUEST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || format('COMMENT-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          echo "G2_TASK_ID=$TASK_ID" >> "$GITHUB_ENV"
          echo "G2_REQUEST_ID=$REQUEST_ID" >> "$GITHUB_ENV"
          echo "G2_TASK_ID=$TASK_ID"
          echo "G2_REQUEST_ID=$REQUEST_ID"

      - name: Prepare live trace repository
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TASK_ID: ${{ env.G2_TASK_ID }}
          REQUEST_ID: ${{ env.G2_REQUEST_ID }}
        shell: bash
        run: |
          set -euo pipefail
          TRACE_BRANCH='automation/status'
          TRACE_REPO='/tmp/g2-trace-repo'
          TRACE_PATH="dispatch/trace/${REQUEST_ID}.json"
          rm -rf "$TRACE_REPO"
          git clone --quiet --depth 1 --branch "$TRACE_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$TRACE_REPO"
          mkdir -p "$TRACE_REPO/dispatch/trace"
          cat > "$TRACE_REPO/$TRACE_PATH" <<EOF
          {
            "task_id":"${TASK_ID}",
            "request_id":"${REQUEST_ID}",
            "state":"starting",
            "phase":"preparing",
            "run_id":${GITHUB_RUN_ID},
            "updated_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "elapsed_seconds":0,
            "last_activity":"Preparing OpenCode/DeepSeek live trace",
            "last_output":[]
          }
          EOF
          sed -i 's/^          //' "$TRACE_REPO/$TRACE_PATH"
          git -C "$TRACE_REPO" config user.name 'github-actions[bot]'
          git -C "$TRACE_REPO" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$TRACE_REPO" add "$TRACE_PATH"
          git -C "$TRACE_REPO" commit -m "chore: start ${REQUEST_ID} live trace" >/dev/null
          git -C "$TRACE_REPO" push --quiet origin "$TRACE_BRANCH"
          printf '%s\n' "$TRACE_REPO" > /tmp/g2-trace-repo
          printf '%s\n' "$TRACE_PATH" > /tmp/g2-trace-path

      - name: Run OpenCode with DeepSeek and stream trace
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          G2_TASK_ID: ${{ env.G2_TASK_ID }}
          G2_REQUEST_ID: ${{ env.G2_REQUEST_ID }}
        shell: bash
        run: |
          set -euo pipefail
          LOG='/tmp/opencode-live.log'
          TRACE_REPO="$(cat /tmp/g2-trace-repo)"
          TRACE_PATH="$(cat /tmp/g2-trace-path)"
          TRACE_BRANCH='automation/status'
          START_EPOCH=$(date +%s)
          export MODEL='${{ inputs.model }}'
          export PROMPT="${{ format('[G2_TASK_ID={0}][G2_REQUEST_ID={1}] {2}', inputs.task_id, inputs.request_id, inputs.prompt) }}"

          curl -fsSL https://opencode.ai/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          echo "OpenCode version: $(opencode --version || true)"

          opencode --log-level DEBUG github run >"$LOG" 2>&1 &
          OC_PID=$!

          publish_trace() {
            local activity="$1"
            local phase='opencode_running'
            local now elapsed output_json
            now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            elapsed=$(($(date +%s)-START_EPOCH))
            case "$activity" in
              *[Bb]uild*|*compile*|*make*|*dtb*) phase='building' ;;
              *[Vv]alidat*|*test*|*check*) phase='validating' ;;
              *[Cc]ommit*|*branch*) phase='committing' ;;
              *[Pp]ull*request*|*PR*) phase='creating_pr' ;;
              *[Ee]dit*|*patch*|*write*) phase='implementing' ;;
              *[Ss]earch*|*read*|*grep*|*source*) phase='researching' ;;
            esac
            output_json=$(tail -n 10 "$LOG" 2>/dev/null | sed 's/[[:cntrl:]]//g' | grep -viE 'api[_-]?key|authorization|bearer|token=' | jq -R -s 'split("\n") | map(select(length>0))' || echo '[]')
            cat > "$TRACE_REPO/$TRACE_PATH" <<EOF
          {
            "task_id":"${G2_TASK_ID}",
            "request_id":"${G2_REQUEST_ID}",
            "state":"running",
            "phase":"${phase}",
            "run_id":${GITHUB_RUN_ID},
            "updated_at":"${now}",
            "elapsed_seconds":${elapsed},
            "last_activity":$(jq -Rn --arg s "$activity" '$s'),
            "last_output":${output_json}
          }
          EOF
            sed -i 's/^          //' "$TRACE_REPO/$TRACE_PATH"
            git -C "$TRACE_REPO" pull --rebase --quiet origin "$TRACE_BRANCH" || true
            git -C "$TRACE_REPO" add "$TRACE_PATH"
            git -C "$TRACE_REPO" commit -m "chore: update ${G2_REQUEST_ID} live trace" >/dev/null 2>&1 || true
            git -C "$TRACE_REPO" push --quiet origin "$TRACE_BRANCH" || true
            echo "[$now] [$phase] $activity"
          }

          while kill -0 "$OC_PID" 2>/dev/null; do
            activity=$(tail -n 1 "$LOG" 2>/dev/null | tr '\n' ' ' | cut -c1-240 || true)
            publish_trace "${activity:-OpenCode/DeepSeek is running}"
            sleep 20
          done

          set +e
          wait "$OC_PID"
          OC_RC=$?
          set -e
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          elapsed=$(($(date +%s)-START_EPOCH))
          final_state='completed'
          final_phase='opencode_completed'
          test "$OC_RC" -eq 0 || { final_state='failed'; final_phase='opencode_failed'; }
          final_json=$(tail -n 20 "$LOG" 2>/dev/null | sed 's/[[:cntrl:]]//g' | grep -viE 'api[_-]?key|authorization|bearer|token=' | jq -R -s 'split("\n") | map(select(length>0))' || echo '[]')
          cat > "$TRACE_REPO/$TRACE_PATH" <<EOF
          {
            "task_id":"${G2_TASK_ID}",
            "request_id":"${G2_REQUEST_ID}",
            "state":"${final_state}",
            "phase":"${final_phase}",
            "run_id":${GITHUB_RUN_ID},
            "updated_at":"${now}",
            "elapsed_seconds":${elapsed},
            "last_activity":"OpenCode/DeepSeek exited with code ${OC_RC}",
            "last_output":${final_json}
          }
          EOF
          sed -i 's/^          //' "$TRACE_REPO/$TRACE_PATH"
          git -C "$TRACE_REPO" pull --rebase --quiet origin "$TRACE_BRANCH" || true
          git -C "$TRACE_REPO" add "$TRACE_PATH"
          git -C "$TRACE_REPO" commit -m "chore: finalize ${G2_REQUEST_ID} live trace" >/dev/null 2>&1 || true
          git -C "$TRACE_REPO" push --quiet origin "$TRACE_BRANCH" || true
          exit "$OC_RC"

      - name: Run official OpenCode action for legacy triggers
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          G2_TASK_ID: ${{ env.G2_TASK_ID }}
          G2_REQUEST_ID: ${{ env.G2_REQUEST_ID }}
        with:
          model: ${{ contains(github.event.comment.body, '[pro]') && 'deepseek/deepseek-v4-pro' || contains(github.event.comment.body, '/oc-pro') && 'deepseek/deepseek-v4-pro' || contains(github.event.comment.body, '/opencode-pro') && 'deepseek/deepseek-v4-pro' || 'deepseek/deepseek-v4-flash' }}
          prompt: ''
          use_github_token: true

      - name: Publish task identity
        if: ${{ always() }}
        env:
          TASK_ID: ${{ env.G2_TASK_ID }}
          REQUEST_ID: ${{ env.G2_REQUEST_ID }}
        run: |
          {
            echo '### G2 development task'
            echo
            echo "- Task ID: \`$TASK_ID\`"
            echo "- Request ID: \`$REQUEST_ID\`"
            echo "- Actions Run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Live trace: \`automation/status:dispatch/trace/${REQUEST_ID}.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize dispatch result with PR correlation
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TASK_ID: ${{ env.G2_TASK_ID }}
          REQUEST_ID: ${{ env.G2_REQUEST_ID }}
        shell: bash
        run: |
          set -euo pipefail
          TRACE_BRANCH='automation/status'
          TRACE_REPO='/tmp/g2-final-trace'
          TRACE_PATH="dispatch/trace/${REQUEST_ID}.json"
          rm -rf "$TRACE_REPO"
          git clone --quiet --depth 1 --branch "$TRACE_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$TRACE_REPO"
          prs=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${REPO}/pulls?state=all&per_page=100")
          pr=$(printf '%s' "$prs" | jq -c --arg task "$TASK_ID" '[.[] | select(((.title // "") | contains($task)) or ((.body // "") | contains($task)) or ((.head.ref // "") | contains($task)))] | sort_by(.created_at) | last // empty')
          if test -n "$pr" && test -f "$TRACE_REPO/$TRACE_PATH"; then
            jq --arg n "$(printf '%s' "$pr" | jq -r '.number')" --arg u "$(printf '%s' "$pr" | jq -r '.html_url')" --arg s "$(printf '%s' "$pr" | jq -r '.state')" --arg h "$(printf '%s' "$pr" | jq -r '.head.sha')" '. + {pr_number:($n|tonumber),pr_url:$u,pr_state:$s,pr_head_sha:$h}' "$TRACE_REPO/$TRACE_PATH" > "$TRACE_REPO/$TRACE_PATH.tmp"
            mv "$TRACE_REPO/$TRACE_PATH.tmp" "$TRACE_REPO/$TRACE_PATH"
            git -C "$TRACE_REPO" config user.name 'github-actions[bot]'
            git -C "$TRACE_REPO" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$TRACE_REPO" add "$TRACE_PATH"
            git -C "$TRACE_REPO" commit -m "chore: correlate ${REQUEST_ID} with PR" >/dev/null 2>&1 || true
            git -C "$TRACE_REPO" push --quiet origin "$TRACE_BRANCH" || true
          fi
