name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify Git remote and credentials
        run: |
          git remote -v
          git status --short
          git config --get remote.origin.url

      - name: Select DeepSeek model
        id: model
        shell: bash
        run: |
          COMMENT='${{ github.event.comment.body }}'
          if [[ "$COMMENT" == *"[pro]"* || "$COMMENT" == *"/oc-pro"* || "$COMMENT" == *"/opencode-pro"* ]]; then
            echo "model=deepseek/deepseek-v4-pro" >> "$GITHUB_OUTPUT"
            echo "tier=pro" >> "$GITHUB_OUTPUT"
          else
            echo "model=deepseek/deepseek-v4-flash" >> "$GITHUB_OUTPUT"
            echo "tier=flash" >> "$GITHUB_OUTPUT"
          fi

      - name: Run OpenCode with official DeepSeek API
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ steps.model.outputs.model }}
          use_github_token: true
