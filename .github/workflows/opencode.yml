name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Unique G2 task identifier'
        required: true
        type: string
      request_id:
        description: 'Unique execution request identifier'
        required: true
        type: string
      workflow_sha:
        description: 'Exact workflow commit SHA dispatched by the bridge'
        required: true
        type: string
      prompt:
        description: 'Exact task for OpenCode / DeepSeek'
        required: true
        type: string
      model:
        description: 'DeepSeek model'
        required: true
        default: 'deepseek/deepseek-v4-flash'
        type: string

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify workflow revision
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_WORKFLOW_SHA" = "$GITHUB_SHA"
          echo "Workflow revision verified: $GITHUB_SHA"

      - name: Set development task identity
        env:
          TASK_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.task_id || format('COMMENT-{0}', github.run_id) }}
          REQUEST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || format('COMMENT-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          echo "G2_TASK_ID=$TASK_ID" >> "$GITHUB_ENV"
          echo "G2_REQUEST_ID=$REQUEST_ID" >> "$GITHUB_ENV"
          echo "G2_WORKFLOW_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Run legacy OpenCode action
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          G2_TASK_ID: ${{ env.G2_TASK_ID }}
          G2_REQUEST_ID: ${{ env.G2_REQUEST_ID }}
        with:
          model: ${{ contains(github.event.comment.body, '[pro]') && 'deepseek/deepseek-v4-pro' || contains(github.event.comment.body, '/oc-pro') && 'deepseek/deepseek-v4-pro' || contains(github.event.comment.body, '/opencode-pro') && 'deepseek/deepseek-v4-pro' || 'deepseek/deepseek-v4-flash' }}
          prompt: ''
          use_github_token: true

      - name: Prepare live trace
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TRACE_BRANCH='automation/status'
          TRACE_REPO='/tmp/g2-trace-repo'
          TRACE_PATH="dispatch/trace/${G2_REQUEST_ID}.json"
          rm -rf "$TRACE_REPO"
          git clone --quiet --depth 1 --branch "$TRACE_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$TRACE_REPO"
          mkdir -p "$TRACE_REPO/dispatch/trace"
          jq -n --arg task "$G2_TASK_ID" --arg req "$G2_REQUEST_ID" --arg run "$GITHUB_RUN_ID" --arg sha "$G2_WORKFLOW_SHA" '{task_id:$task,request_id:$req,state:"starting",phase:"preparing",run_id:($run|tonumber),workflow_sha:$sha,updated_at:now|todateiso8601,elapsed_seconds:0,last_activity:"Preparing OpenCode/DeepSeek live trace",last_output:[]}' > "$TRACE_REPO/$TRACE_PATH"
          git -C "$TRACE_REPO" config user.name 'github-actions[bot]'
          git -C "$TRACE_REPO" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$TRACE_REPO" add "$TRACE_PATH"
          git -C "$TRACE_REPO" commit -m "chore: start ${G2_REQUEST_ID} live trace" >/dev/null
          git -C "$TRACE_REPO" push --quiet origin "$TRACE_BRANCH"
          printf '%s\n' "$TRACE_REPO" > /tmp/g2-trace-repo.path
          printf '%s\n' "$TRACE_PATH" > /tmp/g2-trace-path

      - name: Run OpenCode with DeepSeek and stream trace
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_GITHUB_TOKEN: 'true'
        shell: bash
        run: |
          set -euo pipefail
          LOG='/tmp/opencode-live.log'
          TRACE_REPO="$(cat /tmp/g2-trace-repo.path)"
          TRACE_PATH="$(cat /tmp/g2-trace-path)"
          TRACE_BRANCH='automation/status'
          START_EPOCH=$(date +%s)
          export MODEL='${{ inputs.model }}'
          export PROMPT="${{ format('[G2_TASK_ID={0}][G2_REQUEST_ID={1}] {2}', inputs.task_id, inputs.request_id, inputs.prompt) }}"
          export USE_GITHUB_TOKEN='true'

          npm install -g opencode-ai
          export PATH="$(npm prefix -g)/bin:$PATH"
          echo "OpenCode version: $(opencode --version)"

          opencode --log-level DEBUG github run >"$LOG" 2>&1 &
          OC_PID=$!

          publish_trace() {
            local activity="${1:-OpenCode/DeepSeek is running}"
            local phase='opencode_running'
            case "$activity" in
              *[Bb]uild*|*compile*|*make*|*dtb*) phase='building' ;;
              *[Vv]alidat*|*test*|*check*) phase='validating' ;;
              *[Cc]ommit*|*branch*) phase='committing' ;;
              *[Pp]ull*request*|*PR*) phase='creating_pr' ;;
              *[Ee]dit*|*patch*|*write*) phase='implementing' ;;
              *[Ss]earch*|*read*|*grep*|*source*) phase='researching' ;;
            esac
            local now elapsed output_json
            now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            elapsed=$(($(date +%s)-START_EPOCH))
            output_json=$(tail -n 25 "$LOG" 2>/dev/null | sed 's/[[:cntrl:]]//g' | grep -viE '::add-mask::|api[_-]?key|authorization|bearer|token=|eyJ[A-Za-z0-9_-]{20,}' | jq -R -s 'split("\n") | map(select(length>0))')
            jq -n --arg task "$G2_TASK_ID" --arg req "$G2_REQUEST_ID" --arg phase "$phase" --arg act "$activity" --arg run "$GITHUB_RUN_ID" --arg sha "$G2_WORKFLOW_SHA" --arg now "$now" --argjson elapsed "$elapsed" --argjson output "$output_json" '{task_id:$task,request_id:$req,state:"running",phase:$phase,run_id:($run|tonumber),workflow_sha:$sha,updated_at:$now,elapsed_seconds:$elapsed,last_activity:$act,last_output:$output}' > "$TRACE_REPO/$TRACE_PATH"
            git -C "$TRACE_REPO" add "$TRACE_PATH"
            git -C "$TRACE_REPO" commit -m "chore: update ${G2_REQUEST_ID} live trace" >/dev/null 2>&1 || true
            git -C "$TRACE_REPO" push --quiet origin "$TRACE_BRANCH" || true
            echo "[$now] [$phase] $activity"
          }

          while kill -0 "$OC_PID" 2>/dev/null; do
            activity=$(tail -n 1 "$LOG" 2>/dev/null | sed 's/[[:cntrl:]]//g' | cut -c1-240 || true)
            publish_trace "${activity:-OpenCode/DeepSeek is running}"
            sleep 15
          done

          set +e
          wait "$OC_PID"
          OC_RC=$?
          set -e
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          elapsed=$(($(date +%s)-START_EPOCH))
          final_state='completed'; final_phase='opencode_completed'
          test "$OC_RC" -eq 0 || { final_state='failed'; final_phase='opencode_failed'; }
          final_json=$(tail -n 40 "$LOG" 2>/dev/null | sed 's/[[:cntrl:]]//g' | grep -viE '::add-mask::|api[_-]?key|authorization|bearer|token=|eyJ[A-Za-z0-9_-]{20,}' | jq -R -s 'split("\n") | map(select(length>0))')
          jq -n --arg task "$G2_TASK_ID" --arg req "$G2_REQUEST_ID" --arg state "$final_state" --arg phase "$final_phase" --arg run "$GITHUB_RUN_ID" --arg sha "$G2_WORKFLOW_SHA" --arg now "$now" --argjson elapsed "$elapsed" --argjson output "$final_json" --arg act "OpenCode/DeepSeek exited with code $OC_RC" '{task_id:$task,request_id:$req,state:$state,phase:$phase,run_id:($run|tonumber),workflow_sha:$sha,updated_at:$now,elapsed_seconds:$elapsed,last_activity:$act,last_output:$output}' > "$TRACE_REPO/$TRACE_PATH"
          git -C "$TRACE_REPO" add "$TRACE_PATH"
          git -C "$TRACE_REPO" commit -m "chore: finalize ${G2_REQUEST_ID} live trace" >/dev/null 2>&1 || true
          git -C "$TRACE_REPO" push --quiet origin "$TRACE_BRANCH" || true
          exit "$OC_RC"

      - name: Finalize task identity
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        run: |
          {
            echo '### G2 development task'
            echo
            echo "- Task ID: \`${G2_TASK_ID}\`"
            echo "- Request ID: \`${G2_REQUEST_ID}\`"
            echo "- Actions Run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Workflow SHA: \`${GITHUB_SHA}\`"
            echo "- Live trace: \`automation/status:dispatch/trace/${G2_REQUEST_ID}.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
