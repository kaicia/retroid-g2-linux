name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: "OpenCode task prompt"
        required: true
        type: string
      model:
        description: "DeepSeek model"
        required: false
        default: "deepseek/deepseek-v4-flash"
        type: choice
        options:
          - deepseek/deepseek-v4-flash
          - deepseek/deepseek-v4-pro
  push:
    branches:
      - automation/phase-c-run

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify Git remote and credentials
        run: |
          git remote -v
          git status --short
          git config --get remote.origin.url

      - name: Run OpenCode with official DeepSeek API
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ github.event_name == 'workflow_dispatch' && inputs.model || github.event_name == 'push' && 'deepseek/deepseek-v4-flash' || (contains(github.event.comment.body, '[pro]') && 'deepseek/deepseek-v4-pro' || contains(github.event.comment.body, '/oc-pro') && 'deepseek/deepseek-v4-pro' || contains(github.event.comment.body, '/opencode-pro') && 'deepseek/deepseek-v4-pro' || 'deepseek/deepseek-v4-flash') }}
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || github.event_name == 'push' && 'PHASE-C EXECUTION: Continue actual Retroid Pocket G2 Linux development from PR #9. Inspect PR #9 diff and repository roadmap. Do not repeat Phase A or rebuild the same Phase B artifact without advancing it. Identify and, where exact vendor/Linux evidence supports it, implement the minimum Cliffs GCC/clock-reset, interconnect/pinctrl, PMXR2230 regulator and other kernel providers required by the current G2 DTS. Never invent IDs or substitute unrelated SM8550/RP6 values. Run real non-destructive kernel/DTS/DTB validation and update the removable-microSD boot candidate only when supported. Use DeepSeek V4-Flash by default; no OpenRouter. Hard safety rule: no physical G2 access, no flashing, no block-device writes, no modification of internal Android/UFS/ABL/GPT/boot/vendor_boot/vbmeta/dtbo storage. Work implementation -> validation -> documentation -> dedicated task branch -> commit -> PR. OpenCode must create the PR itself when possible. At completion report exact model/provider, changed files, validation, branch, commit, PR, blockers, and whether the artifact is ready for the first actual G2 microSD test.' || github.event.comment.body }}
          use_github_token: true

      - name: Create PR fallback when OpenCode left an orphaned branch
        if: ${{ github.event_name == 'issue_comment' && !github.event.issue.pull_request }}
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const base = context.payload.repository.default_branch;
            const prefix = `opencode/issue${issueNumber}-`;

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            const candidates = branches.map(b => b.name).filter(name => name.startsWith(prefix));

            if (candidates.length === 0) {
              core.info(`No OpenCode branch found for issue #${issueNumber}; nothing to recover.`);
              return;
            }

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base, per_page: 100,
            });
            const existing = openPrs.find(pr => candidates.includes(pr.head.ref));
            if (existing) {
              core.info(`Open PR #${existing.number} already exists for ${existing.head.ref}.`);
              return;
            }

            for (const head of candidates) {
              const comparison = await github.rest.repos.compareCommits({
                owner, repo, base, head,
              });
              if (comparison.data.ahead_by <= 0 || comparison.data.files?.length === 0) {
                continue;
              }

              const title = `OpenCode issue #${issueNumber}: ${head.replace(prefix, '').slice(0, 80)}`;
              const body = [
                '## OpenCode PR recovery',
                '',
                'OpenCode completed work on this issue branch but did not create the expected PR.',
                'This PR was created automatically as a safety fallback so the development loop does not stall.',
                '',
                `- Issue: #${issueNumber}`,
                `- Head: \\`${head}\\``,
                `- Base: \\`${base}\\``,
                `- Commits ahead: ${comparison.data.ahead_by}`,
                '',
                'The normal OpenCode PR path remains the primary path; this is recovery only.',
              ].join('\\n');

              const pr = await github.rest.pulls.create({
                owner, repo, head, base, title, body,
              });
              core.notice(`Recovered orphaned OpenCode branch ${head} as PR #${pr.data.number}.`);
              return;
            }

            core.info(`No changed OpenCode branch found for issue #${issueNumber}; no fallback PR created.`);
