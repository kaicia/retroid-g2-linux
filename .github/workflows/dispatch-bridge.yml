name: workflow-dispatch bridge

on:
  push:
    paths:
      - 'dispatch/request.json'

jobs:
  dispatch-opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate dispatch request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          test -s dispatch/request.json
          jq -e '(.task_id | type == "string" and length > 0) and (.request_id | type == "string" and length > 0) and (.prompt | type == "string" and length > 0) and ((.model // "deepseek/deepseek-v4-flash") | type == "string") and ((.ref // "main") | type == "string")' dispatch/request.json >/dev/null
          echo "task_id=$(jq -r '.task_id' dispatch/request.json)" >> "$GITHUB_OUTPUT"
          echo "request_id=$(jq -r '.request_id' dispatch/request.json)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r '.ref // \"main\"' dispatch/request.json)" >> "$GITHUB_OUTPUT"

      - name: Pin workflow revision
        id: workflow
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW_SHA="$GITHUB_SHA"
          WORKFLOW_REF="main"
          echo "workflow_sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          echo "workflow_ref=$WORKFLOW_REF" >> "$GITHUB_OUTPUT"
          echo "Pinned workflow revision $WORKFLOW_SHA on ref $WORKFLOW_REF"

      - name: Dispatch OpenCode workflow
        id: dispatch
        env:
          DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_SHA: ${{ steps.workflow.outputs.workflow_sha }}
          WORKFLOW_REF: ${{ steps.workflow.outputs.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DISPATCH_TOKEN"
          payload=$(jq -c --arg sha "$WORKFLOW_SHA" --arg ref "$WORKFLOW_REF" '{ref:$ref,inputs:{task_id:.task_id,request_id:.request_id,workflow_sha:$sha,prompt:.prompt,model:(.model // "deepseek/deepseek-v4-flash")}}' dispatch/request.json)
          echo "dispatch_started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          http_code=$(curl -sS -o /tmp/dispatch-response.json -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/opencode.yml/dispatches" \
            -d "$payload")
          test "$http_code" = "204"
          echo "Dispatch accepted by GitHub (HTTP 204)."

      - name: Wait for dispatched OpenCode Run ID
        id: run
        env:
          DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          STARTED_AT: ${{ steps.dispatch.outputs.dispatch_started }}
          WORKFLOW_SHA: ${{ steps.workflow.outputs.workflow_sha }}
          WORKFLOW_REF: ${{ steps.workflow.outputs.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          started_epoch=$(date -u -d "$STARTED_AT" +%s)
          for attempt in $(seq 1 30); do
            runs=$(curl -fsS \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H "Authorization: Bearer $DISPATCH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/workflows/opencode.yml/runs?event=workflow_dispatch&per_page=50")
            run_id=$(printf '%s' "$runs" | jq -r --argjson started "$started_epoch" --arg ref "$WORKFLOW_REF" --arg sha "$WORKFLOW_SHA" '
              .workflow_runs
              | map(select((.created_at | fromdateiso8601) >= $started and .head_branch == $ref and .head_sha == $sha))
              | sort_by(.created_at)
              | last
              | .id // empty')
            if test -n "$run_id"; then
              run_url=$(printf '%s' "$runs" | jq -r --arg id "$run_id" '.workflow_runs[] | select(.id == ($id | tonumber)) | .html_url')
              run_created=$(printf '%s' "$runs" | jq -r --arg id "$run_id" '.workflow_runs[] | select(.id == ($id | tonumber)) | .created_at')
              run_sha=$(printf '%s' "$runs" | jq -r --arg id "$run_id" '.workflow_runs[] | select(.id == ($id | tonumber)) | .head_sha')
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
              echo "run_created=$run_created" >> "$GITHUB_OUTPUT"
              echo "run_sha=$run_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo 'Dispatched workflow accepted, but the exact Run ID/revision was not observed within 60 seconds.' >&2
          exit 1

      - name: Publish dispatch result
        env:
          TASK_ID: ${{ steps.request.outputs.task_id }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          RUN_URL: ${{ steps.run.outputs.run_url }}
          RUN_CREATED: ${{ steps.run.outputs.run_created }}
          RUN_SHA: ${{ steps.run.outputs.run_sha }}
          WORKFLOW_SHA: ${{ steps.workflow.outputs.workflow_sha }}
          WORKFLOW_REF: ${{ steps.workflow.outputs.workflow_ref }}
          BRIDGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dispatch
          jq -n \
            --arg task_id "$TASK_ID" \
            --arg request_id "$REQUEST_ID" \
            --arg run_id "$RUN_ID" \
            --arg run_url "$RUN_URL" \
            --arg run_created "$RUN_CREATED" \
            --arg run_sha "$RUN_SHA" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            --arg workflow_ref "$WORKFLOW_REF" \
            --arg bridge_sha "$BRIDGE_SHA" \
            '{task_id:$task_id,request_id:$request_id,status:"dispatched",run_id:($run_id|tonumber),run_url:$run_url,run_created:$run_created,run_sha:$run_sha,workflow_sha:$workflow_sha,workflow_ref:$workflow_ref,bridge_commit:$bridge_sha,status_ref:"automation/status",status_path:("dispatch/status/" + $request_id + ".json"),trace_path:("dispatch/trace/" + $request_id + ".json")}' \
            > dispatch/response.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dispatch/response.json
          git commit -m 'chore: record workflow dispatch result' || exit 0
          git push
