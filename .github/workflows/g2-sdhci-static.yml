name: g2-sdhci-static

on:
  push:
    paths:
      - 'dts/g2-sdhci-upstream-candidate.dtsi'
      - 'dts/g2-sdhci-milos-merge.dtsi'
      - 'scripts/validate-g2-sdhci-provider-map.py'
      - '.github/workflows/g2-sdhci-static.yml'
  workflow_dispatch:

jobs:
  static-provider-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run provider-map consistency checks
        run: python3 scripts/validate-g2-sdhci-provider-map.py

      - name: Syntax smoke check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dts/g2-sdhci-upstream-candidate.dtsi')
          s = p.read_text()
          assert s.count('{') == s.count('}'), 'brace mismatch'
          assert s.count('(') == s.count(')'), 'paren mismatch'
          assert 'mmc@8804000' in s
          assert 'status = "disabled";' in s
          print('PASS: DTS fragment structural smoke checks')
          PY

      - name: Install kernel build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev device-tree-compiler

      - name: Clone current Linux source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/torvalds/linux.git linux
          git -C linux rev-parse HEAD | tee linux-revision.txt

      - name: Prepare and compile known-good Milos DTB
        working-directory: linux
        run: |
          set -euo pipefail
          make ARCH=arm64 LLVM=1 defconfig
          make ARCH=arm64 LLVM=1 -j2 arch/arm64/boot/dts/qcom/milos-fairphone-fp6.dtb
          test -s arch/arm64/boot/dts/qcom/milos-fairphone-fp6.dtb
          echo 'PASS: known-good Milos DTB generated'

      - name: Build G2 compile wrapper
        run: |
          set -euo pipefail
          cp dts/g2-sdhci-milos-merge.dtsi linux/arch/arm64/boot/dts/qcom/g2-sdhci-milos-merge.dtsi
          cat > linux/arch/arm64/boot/dts/qcom/g2-sdhci-compile-test.dts <<'EOF'
/dts-v1/;

#include "milos.dtsi"
#include "pm7550.dtsi"
#include "g2-sdhci-milos-merge.dtsi"

/ {
	model = "Retroid Pocket G2 SDHCI compile test";
	compatible = "retroid,g2-sdhci-compile-test", "qcom,milos";
};
EOF
          printf '%s\n' 'dtb-y += g2-sdhci-compile-test.dtb' >> linux/arch/arm64/boot/dts/qcom/Makefile

      - name: Compile G2 SDHCI DTB
        working-directory: linux
        run: |
          set -euo pipefail
          make ARCH=arm64 LLVM=1 -j2 arch/arm64/boot/dts/qcom/g2-sdhci-compile-test.dtb
          test -s arch/arm64/boot/dts/qcom/g2-sdhci-compile-test.dtb
          echo 'PASS: G2 SDHCI DTB generated by Linux build system'
          echo "Linux revision: $(cat ../linux-revision.txt)"

      - name: Save build summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo '# G2 SDHCI compile validation'
            echo
            echo "Linux revision: $(cat linux-revision.txt)"
            echo
            if test -s linux/arch/arm64/boot/dts/qcom/milos-fairphone-fp6.dtb; then
              echo '- Milos baseline DTB: **PASS**'
            else
              echo '- Milos baseline DTB: **FAIL**'
            fi
            if test -s linux/arch/arm64/boot/dts/qcom/g2-sdhci-compile-test.dtb; then
              echo '- G2 candidate DTB: **PASS**'
            else
              echo '- G2 candidate DTB: **FAIL**'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
