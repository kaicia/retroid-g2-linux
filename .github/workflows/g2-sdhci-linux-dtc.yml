name: g2-sdhci-linux-dtc

on:
  push:
    paths:
      - 'dts/cliffs.dtsi'
      - 'dts/cliffs-g2.dts'
      - 'dts/g2-sdhci-compile-test.dts'
      - 'dts/g2-sdhci-milos-merge.dtsi'
      - 'scripts/build-g2-dtb-compile-candidate.sh'
      - 'docs/g2-sdhci-linux-provider-map-20260827.md'
      - '.github/workflows/g2-sdhci-linux-dtc.yml'
  workflow_dispatch:

# Pinned deliberately. The G2 candidate's whole purpose is to disagree with
# upstream `milos` on IRQs, SMMU stream ID and pin map, so an unpinned kernel
# would silently change what the build is being compared against.
env:
  LINUX_REV: 5225b8eec4c9bb21aecff6295fab6346a3c3738e

jobs:
  compile-g2-sdhci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev device-tree-compiler

      - name: Build baseline and G2 candidate DTBs
        run: |
          set -euo pipefail
          LINUX_REV="$LINUX_REV" JOBS=2 scripts/build-g2-dtb-compile-candidate.sh

      - name: Publish DTBs
        uses: actions/upload-artifact@v4
        with:
          name: g2-dtbs
          path: |
            .build/linux/arch/arm64/boot/dts/qcom/cliffs-g2.dtb
            .build/linux/arch/arm64/boot/dts/qcom/g2-sdhci-compile-test.dtb
            .build/linux/arch/arm64/boot/dts/qcom/milos-fairphone-fp6.dtb
          if-no-files-found: error
