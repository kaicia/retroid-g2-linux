# G2 SD-only boot configuration (Phase B, first boot-test candidate)
#
# This is the boot configuration for the microSD image produced by
# scripts/prepare-g2-sd-image.sh from the kernel built by
# scripts/build-g2-kernel.sh (Linux 7.1.5 + kernel/g2/dts/qcom/g2-cliffs-sd.dts).
#
# STATUS: FIRST BOOT-TEST CANDIDATE. The exact G2 early-boot path (stock ABL
# vs UEFI vs ROCKNIX ABL) is NOT yet established from device evidence
# (docs/boot-chain-comparison.md). This extlinux-style layout matches the
# Armada/pocknix/ROCKNIX class SD images (boot partition + ext4 rootfs) but
# must be verified against the actual G2 boot chain before any physical test.
# Do not claim bootability from this file.
#
# Safety: microSD-only. Removing the microSD preserves the stock Android boot
# path; nothing here modifies internal Android/UFS/ABL/vbmeta/dtbo.

DEFAULT g2cliffs
PROMPT 0
TIMEOUT 10

LABEL g2cliffs
	LINUX ../boot/Image
	FDT ../boot/g2-cliffs-sd.dtb
	APPEND root=PARTLABEL=G2-ROOTFS rootwait rw console=ttyMSM0,115200n8
