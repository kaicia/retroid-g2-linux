# G2 SD-only boot configuration (skeleton / draft)
#
# Stage B: this file is the boot configuration entry intended for the
# microSD image built by scripts/prepare-g2-sd-image.sh.
#
# STATUS: DRAFT. The exact G2 early-boot path (stock ABL vs UEFI vs ROCKNIX
# ABL) is NOT yet established from device evidence. Per docs/boot-chain-
# comparison.md, the G2 exposes uefi_a/uefi_b partitions and the RP5
# precedent boots Linux from SD through stock UEFI + GRUB, but this has not
# been proven for the G2. Do not claim bootability from this file.
#
# This config targets the extlinux-style layout used by Armada/pocknix/ROCKNIX
# class SD images (kernel + DTB on a boot partition, rootfs on a second
# partition). Values below are placeholders to be completed once the kernel,
# rootfs and exact root device are fixed by the selected bring-up build.
#
# Safety: microSD-only. Removing the microSD must preserve the stock Android
# boot path; nothing here modifies internal Android/UFS/ABL/vbmeta/dtbo.

DEFAULT g2cliffs
PROMPT 0
TIMEOUT 10

LABEL g2cliffs
	LINUX ../boot/Image
	FDTDIR ../boot
	# TODO: root device - this MUST reference the microSD root partition.
	# The kernel root= path depends on the final image layout and must be
	# verified before any physical boot attempt. Do not guess it here.
	# APPEND root=PARTLABEL=G2-ROOTFS rootwait rw console=ttyMSM0,115200n8
	APPEND root=PARTLABEL=G2-ROOTFS rootwait rw
