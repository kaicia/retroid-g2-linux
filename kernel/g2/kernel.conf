# kernel/g2/kernel.conf — G2 (Cliffs) kernel source pin for the SD-only
# bring-up. POSIX sh, sourced by scripts/build-g2-kernel.sh after the G2
# device profile selects this file.
#
# The G2 kernel model follows the pocknix/ROCKNIX recipe: stock kernel.org
# source pinned here, plus the G2 DTS input set under kernel/g2/dts/ (which
# the build script integrates into arch/arm64/boot/dts/qcom/ with an ensured
# Makefile entry), plus the config under kernel/g2/config/.
#
# Stock kernel.org source, pinned. This is the same Linux 7.1.5 baseline that
# pocknix (kernel/sm8550/kernel.conf) and Armada already run, so the G2 DT
# target builds against a kernel proven in the ARM-handheld SteamOS workflow.
# IMPORTANT: Linux 7.1.5 is a kernel-version/build-system baseline only. It
# contains NO qcom,cliffs-* provider drivers yet (verified: zero "cliffs"
# references in the 7.1.5 source tree), so the G2 DTB compiles but the Cliffs
# GCC/interconnect/pinctrl/PMXR2230 providers it references are NOT yet
# implemented in this kernel. See docs/g2-phase-b-sd-boot-candidate-20260824.md
# for the exact blocker list.
#
# The kernel.org v7.x URL scheme mirrors the pin used by pocknix for Linux 7.1.5.
: "${KERNEL_VERSION:=7.1.5}"
: "${KERNEL_SOURCE_URL:=https://www.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%.*}.x/linux-${KERNEL_VERSION}.tar.xz}"
: "${KERNEL_SOURCE_SHA256:=22a0196b3cbcdf34dc27b77561f4d040585fd3447edc9ab3531a1ac79e3041e7}"

# Cross toolchain prefix for non-aarch64 build hosts.
: "${CROSS_COMPILE:=aarch64-linux-gnu-}"
