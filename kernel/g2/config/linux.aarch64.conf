# kernel/g2/config/linux.aarch64.conf — G2 kernel config fragment.
#
# This fragment is applied ON TOP of a fresh arm64 defconfig. Linux 7.1.5's
# arm64 defconfig already enables CONFIG_ARCH_QCOM, CONFIG_MMC_SDHCI_MSM,
# CONFIG_MMC_BLOCK, CONFIG_EXT4_FS, CONFIG_DEVTMPFS and CONFIG_SERIAL_MSM, so
# the only config work needed for the first SD boot-test candidate is:
#
#   make defconfig
#   make olddefconfig          (fragment is intentionally minimal/no-op today)
#
# The G2 DTB (dts/qcom/g2-cliffs-sd.dts) is built by the same kernel build
# under CONFIG_ARCH_QCOM=y via arch/arm64/boot/dts/qcom/Makefile.
#
# Everything required for the SD boot test (SDHCI, SD card block device,
# ext4 rootfs, devtmpfs console, MSM serial console) is already in the arm64
# defconfig of Linux 7.1.5. This file exists so the G2 build has an explicit,
# versioned place to add config when later bring-up work needs it (e.g. a
# CONFIG_CMDLINE for the SD root, or enabling the downstream SDHCI driver).
#
# No device-specific config value is invented here. Values are only added
# when a real G2 boot log or driver requirement demands them.
