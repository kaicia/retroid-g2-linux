# kernel/g2/config/linux.aarch64.conf — G2 kernel config fragment.
#
# This fragment is applied ON TOP of a fresh arm64 defconfig (via
# scripts/kconfig/merge_config.sh in scripts/build-g2-kernel.sh). Linux 7.1.5's
# arm64 defconfig already enables CONFIG_ARCH_QCOM, CONFIG_MMC_SDHCI_MSM,
# CONFIG_MMC_BLOCK, CONFIG_EXT4_FS, CONFIG_DEVTMPFS and CONFIG_SERIAL_MSM.
#
# The G2 DTB (dts/qcom/g2-cliffs-sd.dts) is built by the same kernel build
# under CONFIG_ARCH_QCOM=y via arch/arm64/boot/dts/qcom/Makefile.
#
# CONFIG_SM_GCC_CLIFFS enables the minimum Cliffs GCC clock/reset provider
# (drivers/clk/qcom/gcc-cliffs.c, patch 0003) that the G2 DTS references via
# "qcom,cliffs-gcc" and the GCC_SDCC2_* clock/reset IDs. It is a tristate
# option; select =y so the provider is built into the kernel Image.
CONFIG_SM_GCC_CLIFFS=y

# Everything else required for the SD boot test (SDHCI, SD card block device,
# ext4 rootfs, devtmpfs console, MSM serial console) is already in the arm64
# defconfig of Linux 7.1.5.
#
# No device-specific config value is invented here. Values are only added
# when a real G2 boot log or driver requirement demands them.
