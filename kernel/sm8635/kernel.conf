# kernel/sm8635/kernel.conf — Cliffs (Snapdragon G2 Gen 2) kernel family
#
# holodor/pocknix-format kernel config for the Retroid Pocket G2 (SM8635 /
# Cliffs). Drop this tree into a holodor checkout as kernel/sm8635/ to build
# linux-pocknix-sm8635.
#
# IMPORTANT — this family is AUTHORED, not `make sync`-ed. holodor's sync.sh
# vendors kernel/<soc>/ from a ROCKNIX devices/<SOC> dir, but ROCKNIX has no
# SM8635 (they ship SM8250/8550/8650/8750). So there is no upstream to sync
# from: the patch stack under patches/20-sm8635/ is ported by hand from the
# Xiaomi Cliffs GPL source (see patches/20-sm8635/PORT-MANIFEST.md), and the
# DTS is our own bring-up tree (see dts/README.md). `make sync` must NOT be run
# for this SoC — it would try to reach a nonexistent ROCKNIX dir and wipe this.

# Target the same mainline base as holodor's other families for parity.
: "${KERNEL_VERSION:=7.1.2}"
: "${KERNEL_SOURCE_URL:=https://www.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%.*}.x/linux-${KERNEL_VERSION}.tar.xz}"
: "${KERNEL_SOURCE_SHA256:=37198c93727be247c9fb5309bb86cd5e496c61e5322cd8c4eca9476bb0b5883f}"

# Version-specific patch dir (mirrors holodor: 7.1.x -> 7.0 patch set).
: "${ROCKNIX_VERSION_PATCH_DIR:=7.0}"

# ROCKNIX_SOC is AUTHORED here (no upstream ROCKNIX SM8635 dir exists). It only
# labels the family; nothing syncs against it. Do not `make sync`.
: "${ROCKNIX_SOC:=SM8635}"

# Cliffs vendor driver source (GPL-2.0), the base for patches/20-sm8635/:
#   repo    MiCode/Xiaomi_Kernel_OpenSource
#   branch  peridot-u-oss
#   commit  062233df735dd3db2e20aea2f7d3f87c0b1ffde2
# See patches/20-sm8635/PORT-MANIFEST.md for the per-driver file list + status.
