# devices/sm8635 — Retroid Pocket G2 (Snapdragon G2 Gen 2 / Cliffs / SM8635)
DEVICE_PRETTY="Retroid Pocket G2 (SM8635 / Cliffs)"
DEVICE_HOSTNAME="pocknix"
: "${SOC:=sm8635}"
: "${ROCKNIX_SOC:=SM8635}"            # authored; no upstream ROCKNIX SM8635 (do not `make sync`)
: "${BOOTLOADER:=arm-efi}"            # factory ABL -> GRUB -> raw Image (Path A); pending on-device re-verify
: "${SD_FAT_LABEL:=ROCKNIX}"
: "${SD_BOOT_PARTNAME:=system}"
: "${ROOT_LABEL:=POCKNIX_ROOT}"
: "${KERNEL_CMDLINE_ROOT:=root=PARTUUID=${SD_ROOT_PARTUUID} rw}"
: "${KERNEL_CMDLINE_EXTRA:=quiet loglevel=3 rootwait console=tty0 earlycon=qcom_geni,0xa94000}"
: "${KERNEL_CMDLINE:=${KERNEL_CMDLINE_ROOT} ${KERNEL_CMDLINE_EXTRA}}"
: "${DEVICE_BSP_PKG:=pocknix-bsp-sm8635}"
: "${DEVICE_META_PKG:=pocknix-device-sm8635}"
: "${KERNEL_PKG:=linux-pocknix-${SOC}}"
