# Retroid Pocket G2 — Tier 0 boot menu.
#
# Lives at /boot/grub/grub.cfg on the SD card's FAT32 ESP; that path is the
# prefix baked into bootaa64.efi (grub-mkimage -p /boot/grub).
#
# Tier 0's whole goal is ONE LINE of kernel output. There is no root
# filesystem, so the kernel is expected to panic with "VFS: Unable to mount
# root fs" or "No working init found". Reaching that panic IS the success
# signal: it means the firmware handed off, the DTB was accepted, the CPUs and
# timer came up, and the console works. panic=60 holds the message on screen
# long enough to read or photograph before the reboot.

insmod part_gpt
insmod fat
insmod fdt
insmod all_video

set timeout=5
set default=0

# Primary: earlycon with no argument, which makes the kernel follow
# chosen/stdout-path in our DTB to serial@a94000. console=tty0 puts the same
# log on the display via the EFI framebuffer, so the test still yields evidence
# if the UART lines turn out not to be reachable.
menuentry 'G2 Tier 0 — earlycon via stdout-path + framebuffer' --id 'g2-tier0' {
	search --set=root -f /KERNEL
	linux /KERNEL earlycon keep_bootcon console=tty0 loglevel=8 ignore_loglevel panic=60
	devicetree /cliffs-g2.dtb
}

# Fallback: name the UART explicitly, in case stdout-path resolution fails.
menuentry 'G2 Tier 0 — earlycon at an explicit address' --id 'g2-tier0-addr' {
	search --set=root -f /KERNEL
	linux /KERNEL earlycon=qcom_geni,0xa94000 keep_bootcon console=tty0 loglevel=8 ignore_loglevel panic=60
	devicetree /cliffs-g2.dtb
}

# Display only — use if the UART entries produce nothing at all, to separate
# "kernel never started" from "kernel started but the UART is unreachable".
menuentry 'G2 Tier 0 — framebuffer console only' --id 'g2-tier0-fb' {
	search --set=root -f /KERNEL
	linux /KERNEL console=tty0 loglevel=8 ignore_loglevel panic=60
	devicetree /cliffs-g2.dtb
}
