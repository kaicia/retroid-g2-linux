# Retroid Pocket G2 — Path A Stage 0 menu (2026-09-29).
#
# Stage 0 asks one question: does the G2's FACTORY ABL chainload
# \EFI\BOOT\bootaa64.efi off an SD card laid out exactly like the RP5's
# production arm-efi card (FAT32 p1 named "system" with the legacy_boot
# attribute and NO ESP type GUID, ext4 p2)? See docs/g2-path-a-reverify-20260929.md.
#
#   This menu appears on screen   -> YES. Path A is reopened.
#   Android boots, no menu        -> NO. Path A is closed against the RP5 contract too.
#
# The menu waits forever (timeout=-1) so it cannot be missed. The first entry
# then tries the SM8635 kernel as a bonus; the Stage 0 answer does not depend on it.

insmod part_gpt
insmod fat
insmod fdt
insmod all_video

set timeout=-1
set default=0

# No earlycon: an unclocked GENI write can hang (docs/g2-tier0-fastboot-plan-20260915.md).
# console=tty0 puts the log on the display. No root= and no panic= timeout, so a
# successful boot ends in "VFS: Unable to mount root fs" and stays on screen.
menuentry 'G2 Stage 0: GRUB reached - boot SM8635 test kernel' --id 'g2-stage0-kernel' {
	search --set=root -f /KERNEL
	linux /KERNEL console=tty0 loglevel=8 ignore_loglevel
	devicetree /boot/grub/cliffs-g2.dtb
}

menuentry 'G2 Stage 0: reboot (back to Android)' --id 'g2-stage0-reboot' {
	reboot
}

menuentry 'G2 Stage 0: power off' --id 'g2-stage0-off' {
	halt
}
